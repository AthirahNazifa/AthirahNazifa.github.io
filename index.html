<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Athirah Nazifa | Junior Software Engineer</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: #0b0d12;
      color: #f5f7fa;
      font-family: Arial, Helvetica, sans-serif;
    }

    .profile-card {
      width: 100%;
      max-width: 500px;
      padding: 42px;
      text-align: center;
      background: #151922;
      border: 1px solid #292f3d;
      border-radius: 22px;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.4);
    }

    .avatar {
      width: 92px;
      height: 92px;
      margin: 0 auto 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      background: #252c3b;
      color: #b7c1ff;
      font-size: 30px;
      font-weight: 700;
    }

    h1 {
      margin-bottom: 8px;
      font-size: 32px;
      letter-spacing: -0.5px;
    }

    .role {
      margin-bottom: 26px;
      color: #aeb9ff;
      font-size: 16px;
    }

    .skills {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
      margin-bottom: 30px;
    }

    .skill {
      padding: 8px 14px;
      border: 1px solid #303747;
      border-radius: 999px;
      background: #202532;
      color: #dce1ec;
      font-size: 14px;
    }

    .fun-fact {
      padding-top: 24px;
      border-top: 1px solid #292f3d;
      color: #aeb4c0;
      font-size: 15px;
      line-height: 1.7;
    }

    @media (max-width: 480px) {
      .profile-card {
        padding: 32px 24px;
      }

      h1 {
        font-size: 28px;
      }
    }
  </style>
</head>

<body>

  <main class="profile-card">
    <div class="avatar">AN</div>

    <h1>Athirah Nazifa</h1>

    <p class="role">Junior Software Engineer</p>

    <div class="skills">
      <span class="skill">Next.js</span>
      <span class="skill">TypeScript</span>
      <span class="skill">Node.js</span>
      <span class="skill">MySQL</span>
      <span class="skill">Git</span>
      <span class="skill">Docker</span>
      <span class="skill">AWS</span>
    </div>

    <p class="fun-fact">
      Fun fact: I enjoy building practical software projects while exploring everything from UI/UX and web development to DevOps and cloud technologies.
    </p>
  </main>

</body>
</html>
